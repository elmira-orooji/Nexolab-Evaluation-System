[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexolab"
version = "0.1.0"
description = "Reproducible Persian RAG runs for manual evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexolab = "nexolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
