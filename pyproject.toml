[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexolab"
version = "0.1.0"
description = "Reproducible Persian RAG runs for manual evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
evaluation = ["deepeval>=3.0,<4"]

[project.scripts]
nexolab = "nexolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
